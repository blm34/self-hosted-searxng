services:
  core:
    container_name: searxng-core
    image: searxng/searxng:2026.8.11-e8e710e42
    restart: unless-stopped
    env_file: ./.env

    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

    environment:
      VIRTUAL_HOST: ${DOMAIN}
      LETSENCRYPT_HOST: ${DOMAIN}
      VIRTUAL_PORT: 8080

    labels:
      wud.trigger.include: ntfy.local,dockercompose.searxng
      wud.tag.include: ^\d+\.\d+\.\d+-[0-9a-f]+$
      wud.compose.file: /wud/searxng/compose.yaml

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      valkey:
        condition: service_healthy

    networks:
      - searxng
      - nginx-proxy-net

  valkey:
    container_name: searxng-valkey
    image: valkey/valkey:9.1.1-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped

    volumes:
      - valkey-data:/data/

    labels:
      wud.trigger.include: ntfy.local,dockercompose.searxng
      wud.tag.include: ^\d+\.\d+\.\d+-alpine$
      wud.compose.file: /wud/searxng/compose.yaml

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - searxng

volumes:
  core-data:
  valkey-data:

networks:
  nginx-proxy-net:
    external: true
  searxng:
